version: 2.1
orbs:
  circleci/aws-cli@5.4.1:
jobs:
  build:
    machine:
      image: ubuntu-2204:2025.09.1
    steps:
      - checkout
      - run: sudo apt install yasm nasm
      - run: ./configure --prefix=$(pwd)/out && make && make install
      - run: mkdir -p build && cd out && tar -cvzf ../build/ffmpeg-2.8.tar .
      - persist_to_workspace:
          root: build
          paths:
            - ffmpeg-2.8.tar
  publish:
    environment:
      AWS_REGION: us-west-2
    docker:
      - image: cimg/aws:2025.01.1
    steps:
      - checkout
      - aws-cli/setup:
          role_arn: "arn:aws:iam::327466685659:role/circle-ci-ffmpeg2.8-wmg-deploy-s3"
          aws-region: ${AWS_REGION}
          profile-name: "oidc-profile"
      - attach_workspace:
          at: build
      - run: |
          aws s3 cp build/ffmpeg-2.8.tar s3://wmg-deploy/ffmpeg-2.8.tar --profile "oidc-profile"

workflows:
  version: 2
  build-and-publish:
    jobs:
      - build
      - publish:
          requires:
            - build
          filters:
            branches:
              only: vendor